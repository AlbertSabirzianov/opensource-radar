<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSource Radar – Find your first open-source issue</title>
    <meta
      name="description"
      content="Search beginner-friendly open issues across all of GitHub. Find good first issues nobody has taken yet, filter by language and project, and make your first open-source contribution."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://opensource-radar-nine.vercel.app/" />

    <!-- Preview when the link is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenSource Radar" />
    <meta property="og:title" content="OpenSource Radar – Find your first open-source issue" />
    <meta
      property="og:description"
      content="Search beginner-friendly open issues across all of GitHub and make your first contribution."
    />
    <meta property="og:url" content="https://opensource-radar-nine.vercel.app/" />
    <meta property="og:image" content="https://opensource-radar-nine.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OpenSource Radar: find your first open-source issue. Search beginner-friendly issues across all of GitHub."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://opensource-radar-nine.vercel.app/og-image.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var theme = localStorage.getItem("opensource-radar-theme");
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        // Storage unavailable; the app falls back to light.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
